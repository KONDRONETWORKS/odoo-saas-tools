name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Static Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f pyproject.toml ]; then pip install ruff black; fi

      - name: Ruff
        run: |
          if command -v ruff >/dev/null 2>&1; then
            ruff check .
          else
            echo "Ruff non installé, étape ignorée."
          fi

      - name: Black (vérification)
        run: |
          if command -v black >/dev/null 2>&1; then
            black --check .
          else
            echo "Black non installé, étape ignorée."
          fi

  tests:
    name: Tests Odoo
    runs-on: ubuntu-latest
    needs:
      - lint
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: odoo
      PGPASSWORD: odoo
      ODOO_RC: odoo.conf
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Initialiser la base de test
        run: |
          createdb -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" odoo_test

      - name: Lancer les tests cibles
        run: |
          ./odoo-bin \
            --config "${ODOO_RC}" \
            --db_host "${PGHOST}" \
            --db_port "${PGPORT}" \
            --db_user "${PGUSER}" \
            --db_password "${PGPASSWORD}" \
            --database odoo_test \
            --test-tags saas_portal \
            --stop-after-init

  docker:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    needs:
      - tests
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: config/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs:
      - docker
    if: github.ref == 'refs/heads/main'
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Vérifier la configuration
        run: |
          missing=0
          for var in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH REGISTRY_USERNAME REGISTRY_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "Variable ${var} absente. Ajoutez-la dans les secrets GitHub."
              missing=1
            fi
          done
          if [ $missing -eq 1 ]; then
            exit 1
          fi
          : "${DEPLOY_PORT:=22}"
          echo "DEPLOY_PORT=${DEPLOY_PORT}" >> "${GITHUB_ENV}"

      - name: Checkout (facultatif)
        uses: actions/checkout@v4

      - name: Déploiement sur le serveur
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: REGISTRY,REGISTRY_USERNAME,REGISTRY_PASSWORD,DEPLOY_PATH
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail
            if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_CMD="docker-compose"
            else
              echo "docker compose ou docker-compose introuvable sur le serveur distant."
              exit 1
            fi
            printf '%s\n' "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin
            cd "$DEPLOY_PATH"
            $COMPOSE_CMD pull
            $COMPOSE_CMD up -d
            docker image prune -f
            docker logout "$REGISTRY"

