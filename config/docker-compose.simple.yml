# 🏗️ Configuration Docker Compose - Développement Complet
# Note: 'version' est obsolète dans Docker Compose v2+
# Usage: docker-compose -f config/docker-compose.simple.yml up -d
# 
# Cette configuration est optimisée pour le développement avec tous les modules montés individuellement.
# Elle utilise l'image officielle Odoo 18 et permet un développement modulaire.

services:
  postgres:
    image: postgres:15
    container_name: saas-postgres-dev
    environment:
      POSTGRES_DB: odoo
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # Port 5433 pour éviter conflit avec PostgreSQL local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - saas-network-dev
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  odoo:
    image: odoo:18
    container_name: saas-odoo-dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Configuration base de données
      - HOST=postgres
      - USER=odoo
      - PASSWORD=odoo
      - DB_HOST=postgres
      - DB_USER=odoo
      - DB_PASSWORD=odoo
      - DB_PORT=5432
      # Configuration Odoo
      - ODOO_RC=/etc/odoo/odoo.conf
    # Installer les dépendances Python au démarrage
    entrypoint: >
      bash -c "
      pip install --break-system-packages 'oauthlib>=3.2.0' 'simplejson>=3.19.0' 2>/dev/null || true &&
      /entrypoint.sh odoo
      "
    ports:
      - "8069:8069"   # XML-RPC
      - "8072:8072"   # Longpolling
    volumes:
      # ============================================
      # Modules Core (Obligatoires)
      # ============================================
      - ../saas_base:/mnt/extra-addons/saas_base
      - ../saas_portal:/mnt/extra-addons/saas_portal
      - ../saas_server:/mnt/extra-addons/saas_server
      - ../saas_client:/mnt/extra-addons/saas_client
      
      # ============================================
      # Modules OAuth (Sécurité)
      # ============================================
      - ../saas_oauth_provider:/mnt/extra-addons/saas_oauth_provider
      - ../saas_auth_oauth_ip:/mnt/extra-addons/saas_auth_oauth_ip
      - ../saas_auth_oauth_check_client_id:/mnt/extra-addons/saas_auth_oauth_check_client_id
      
      # ============================================
      # Modules Portail (Interface)
      # ============================================
      - ../saas_portal_portal:/mnt/extra-addons/saas_portal_portal
      - ../saas_portal_start:/mnt/extra-addons/saas_portal_start
      - ../saas_portal_signup:/mnt/extra-addons/saas_portal_signup
      - ../saas_portal_templates:/mnt/extra-addons/saas_portal_templates
      - ../saas_portal_demo:/mnt/extra-addons/saas_portal_demo
      
      # ============================================
      # Modules Vente (Optionnels)
      # ============================================
      - ../saas_portal_sale:/mnt/extra-addons/saas_portal_sale
      - ../saas_portal_sale_online:/mnt/extra-addons/saas_portal_sale_online
      - ../saas_portal_sale_subscription:/mnt/extra-addons/saas_portal_sale_subscription
      - ../saas_portal_subscription:/mnt/extra-addons/saas_portal_subscription
      
      # ============================================
      # Modules Infrastructure (Optionnels)
      # ============================================
      - ../saas_sysadmin:/mnt/extra-addons/saas_sysadmin
      - ../saas_sysadmin_aws:/mnt/extra-addons/saas_sysadmin_aws
      - ../saas_sysadmin_aws_route53:/mnt/extra-addons/saas_sysadmin_aws_route53
      - ../saas_sysadmin_route53:/mnt/extra-addons/saas_sysadmin_route53
      - ../saas_sysadmin_mailgun:/mnt/extra-addons/saas_sysadmin_mailgun
      
      # ============================================
      # Modules Backup (Optionnels)
      # ============================================
      - ../saas_server_backup_ftp:/mnt/extra-addons/saas_server_backup_ftp
      - ../saas_server_backup_s3:/mnt/extra-addons/saas_server_backup_s3
      - ../saas_server_backup_rotate:/mnt/extra-addons/saas_server_backup_rotate
      - ../saas_server_backup_rotate_s3:/mnt/extra-addons/saas_server_backup_rotate_s3
      
      # ============================================
      # Modules Utilitaires
      # ============================================
      - ../saas_portal_async:/mnt/extra-addons/saas_portal_async
      - ../saas_portal_backup:/mnt/extra-addons/saas_portal_backup
      - ../saas_portal_cache:/mnt/extra-addons/saas_portal_cache
      - ../saas_portal_client_web:/mnt/extra-addons/saas_portal_client_web
      - ../saas_portal_monitoring:/mnt/extra-addons/saas_portal_monitoring
      - ../saas_portal_quotas:/mnt/extra-addons/saas_portal_quotas
      - ../saas_portal_signup_custom:/mnt/extra-addons/saas_portal_signup_custom
      - ../saas_portal_tagging:/mnt/extra-addons/saas_portal_tagging
      - ../saas_server_autodelete:/mnt/extra-addons/saas_server_autodelete
      - ../saas_server_demo:/mnt/extra-addons/saas_server_demo
      - ../saas_utils:/mnt/extra-addons/saas_utils
      - ../saas_product_price_factor:/mnt/extra-addons/saas_product_price_factor
      - ../saas_oadmin:/mnt/extra-addons/saas_oadmin
      - ../saas_oclient:/mnt/extra-addons/saas_oclient
      - ../saas_oconfig:/mnt/extra-addons/saas_oconfig
      - ../saas_ocore:/mnt/extra-addons/saas_ocore
      - ../saas_oserver:/mnt/extra-addons/saas_oserver
      - ../website_sale_require_login:/mnt/extra-addons/website_sale_require_login
      
      # ============================================
      # Configuration et Données
      # ============================================
      - ../odoo.conf.docker:/etc/odoo/odoo.conf:ro
      - ../filestore:/var/lib/odoo/filestore
      - odoo_logs:/var/log/odoo
    command: >
      odoo
      --config=/etc/odoo/odoo.conf
      --db_host=postgres
      --db_user=odoo
      --db_password=odoo
      --addons-path=/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
      --data-dir=/var/lib/odoo
      --xmlrpc-port=8069
      --gevent-port=8072
      --workers=3
      --max-cron-threads=2
      --without-demo=all
      --db-filter=.*
      --log-level=info
      --logfile=/var/log/odoo/odoo.log
    networks:
      - saas-network-dev
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8069/web/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data_dev:
    driver: local
    name: saas_postgres_data_dev
  odoo_logs:
    driver: local
    name: saas_odoo_logs

networks:
  saas-network-dev:
    driver: bridge
    name: saas_network_dev
