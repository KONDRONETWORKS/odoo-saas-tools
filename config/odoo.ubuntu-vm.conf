[options]
# ---------- Configuration Odoo SaaS Tools - Production Ubuntu VM ----------
# VM: 10.10.10.40
# Ubuntu 22.04.5

# ---------- Authentification & sécurité ----------
admin_passwd = ${ODOO_ADMIN_PASSWD}
list_db = False
proxy_mode = True

# ---------- Base de données ----------
# Les valeurs seront remplacées par Docker Compose
db_host = postgres
db_port = 5432
db_user = ${POSTGRES_USER:-odoo}
db_password = ${POSTGRES_PASSWORD}
db_name = ${POSTGRES_DB:-odoo}
db_filter = ^%d$

# ---------- Modules ----------
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
server_wide_modules = web,web_kanban

# ---------- Fichiers & logs ----------
data_dir = /var/lib/odoo
logfile = /var/log/odoo/odoo.log
log_level = info
logrotate = True

# ---------- Serveur ----------
xmlrpc_port = 8069
longpolling_port = 8072
workers = ${WORKERS:-4}
max_cron_threads = ${MAX_CRON_THREADS:-2}

# ---------- Limites ----------
limit_time_cpu = 600
limit_time_real = 1200
limit_memory_soft = ${LIMIT_MEMORY_SOFT:-2147483648}    # 2 Go par défaut
limit_memory_hard = ${LIMIT_MEMORY_HARD:-2684354560}    # 2,5 Go par défaut

# ---------- Courriel (à configurer selon vos besoins) ----------
# smtp_server = smtp.gmail.com
# smtp_port = 587
# smtp_ssl = False
# smtp_user = ${SMTP_USER}
# smtp_password = ${SMTP_PASSWORD}

# ---------- Divers ----------
without_demo = True

# ---------- Performance ----------
# Optimisations pour production
limit_request = 8192
limit_time_real_cron = -1

