[options]
# ---------- Authentification ----------
admin_passwd = admin

# ---------- Base de données ----------
db_host = localhost
db_port = 5432
db_user = odoo
db_password = odoo
db_name = odoo
db_filter = .*

# ---------- Modules ----------
addons_path = /Users/apple/KONDRO/odoo-sass/odoo-saas-tools,
              /Users/apple/KONDRO/odoo-sass/odoo/addons,
              /Users/apple/KONDRO/odoo-sass/odoo/odoo/addons,
              /Users/apple/KONDRO/odoo-sass/odoo-saas-tools/kondro

# ---------- Fichiers & logs ----------
data_dir = /Users/apple/KONDRO/odoo-sass/odoo-saas-tools/filestore
logfile = /Users/apple/KONDRO/odoo-sass/odoo-saas-tools/odoo.log
log_level = debug

# ---------- Serveur ----------
xmlrpc_port = 8069
longpolling_port = 8072
workers = 0
max_cron_threads = 0

# ---------- Confort développeur ----------
limit_time_cpu = 120
limit_time_real = 240
dev_mode = all
test_enable = False
without_demo = True

