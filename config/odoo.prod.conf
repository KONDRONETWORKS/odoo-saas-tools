[options]
# ---------- Authentification & sécurité ----------
admin_passwd = ${ODOO_ADMIN_PASSWD}
list_db = False
proxy_mode = True

# ---------- Base de données ----------
db_host = rds-odoo.example.com
db_port = 5432
db_user = odoo_prod
db_password = ${ODOO_DB_PASSWORD}
db_name = odoo_prod
db_filter = ^%d$

# ---------- Modules ----------
addons_path = /opt/odoo/addons,/opt/odoo/custom
server_wide_modules = web,web_kanban

# ---------- Fichiers & logs ----------
data_dir = /var/lib/odoo
logfile = /var/log/odoo/odoo.log
log_level = info
logrotate = True

# ---------- Serveur ----------
xmlrpc_port = 8069
longpolling_port = 8072
workers = 8
max_cron_threads = 4

# ---------- Limites ----------
limit_time_cpu = 600
limit_time_real = 1200
limit_memory_soft = 2147483648    # 2 Go
limit_memory_hard = 2684354560    # 2,5 Go

# ---------- Courriel ----------
smtp_server = email-smtp.eu-west-1.amazonaws.com
smtp_port = 587
smtp_ssl = False
smtp_user = ${SMTP_USER}
smtp_password = ${SMTP_PASSWORD}

# ---------- Divers ----------
without_demo = True
geoip_database = /opt/odoo/data/GeoLite2-City.mmdb

