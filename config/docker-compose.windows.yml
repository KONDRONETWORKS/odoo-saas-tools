services:
  postgres:
    image: postgres:15
    container_name: saas-postgres
    environment:
      POSTGRES_DB: odoo
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # Port 5433 sur host pour éviter conflit avec PostgreSQL local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saas-network
    restart: unless-stopped

  odoo:
    build:
      context: ..
      dockerfile: config/Dockerfile
    container_name: saas-odoo
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - DB_USER=odoo
      - DB_PASSWORD=odoo
      - DB_PORT=5432
    ports:
      - "8069:8069"
      - "8072:8072"
    volumes:
      # Monter les modules SaaS
      - ../saas_base:/opt/odoo/saas_base
      - ../saas_portal:/opt/odoo/saas_portal
      - ../saas_server:/opt/odoo/saas_server
      - ../saas_client:/opt/odoo/saas_client
      - ../saas_portal_portal:/opt/odoo/saas_portal_portal
      - ../saas_portal_start:/opt/odoo/saas_portal_start
      - ../saas_portal_signup:/opt/odoo/saas_portal_signup
      - ../saas_portal_templates:/opt/odoo/saas_portal_templates
      - ../saas_oauth_provider:/opt/odoo/saas_oauth_provider
      - ../saas_auth_oauth_ip:/opt/odoo/saas_auth_oauth_ip
      - ../saas_auth_oauth_check_client_id:/opt/odoo/saas_auth_oauth_check_client_id
      - ../saas_sysadmin:/opt/odoo/saas_sysadmin
      - ../saas_utils:/opt/odoo/saas_utils
      - ../saas_portal_quotas:/opt/odoo/saas_portal_quotas
      - ../saas_portal_sale:/opt/odoo/saas_portal_sale
      - ../saas_portal_sale_online:/opt/odoo/saas_portal_sale_online
      - ../saas_portal_sale_subscription:/opt/odoo/saas_portal_sale_subscription
      - ../saas_portal_subscription:/opt/odoo/saas_portal_subscription
      - ../saas_portal_async:/opt/odoo/saas_portal_async
      - ../saas_portal_backup:/opt/odoo/saas_portal_backup
      - ../saas_portal_demo:/opt/odoo/saas_portal_demo
      - ../saas_portal_monitoring:/opt/odoo/saas_portal_monitoring
      - ../saas_portal_tagging:/opt/odoo/saas_portal_tagging
      - ../saas_server_autodelete:/opt/odoo/saas_server_autodelete
      - ../saas_server_backup_ftp:/opt/odoo/saas_server_backup_ftp
      - ../saas_server_backup_s3:/opt/odoo/saas_server_backup_s3
      - ../saas_server_backup_rotate:/opt/odoo/saas_server_backup_rotate
      - ../saas_server_backup_rotate_s3:/opt/odoo/saas_server_backup_rotate_s3
      - ../saas_server_demo:/opt/odoo/saas_server_demo
      - ../saas_sysadmin_aws:/opt/odoo/saas_sysadmin_aws
      - ../saas_sysadmin_aws_route53:/opt/odoo/saas_sysadmin_aws_route53
      - ../saas_sysadmin_mailgun:/opt/odoo/saas_sysadmin_mailgun
      - ../saas_sysadmin_route53:/opt/odoo/saas_sysadmin_route53
      - ../saas_product_price_factor:/opt/odoo/saas_product_price_factor
      - ../website_sale_require_login:/opt/odoo/website_sale_require_login
      # Répertoires Odoo
      - ../odoo:/opt/odoo/odoo
      - ../filestore:/opt/odoo/filestore
      # Configuration
      - ../odoo.conf:/opt/odoo/odoo.conf
    working_dir: /opt/odoo
    command: >
      python3 saas.py
      --odoo-config odoo.conf
      --odoo-script ../odoo/odoo-bin
      --master-password admin
      --admin-password admin
      --use-existed-odoo
      --portal-create
      --server-create
      --plan-create
      --run
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8069 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - saas-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  saas-network:
    driver: bridge

