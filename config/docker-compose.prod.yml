version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: odoo
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - odoo-network

  odoo:
    build: .
    depends_on:
      - postgres
    environment:
      - HOST=postgres
      - USER=odoo
      - PASSWORD=${POSTGRES_PASSWORD}
      - ODOO_RC=/opt/odoo/odoo.conf
    ports:
      - "8069:8069"
    volumes:
      - ./addons:/opt/odoo/addons
      - ./filestore:/opt/odoo/filestore
      - ./config:/opt/odoo/config
    restart: unless-stopped
    networks:
      - odoo-network

  odoo-queue:
    build: .
    depends_on:
      - postgres
    environment:
      - HOST=postgres
      - USER=odoo
      - PASSWORD=${POSTGRES_PASSWORD}
      - ODOO_RC=/opt/odoo/odoo.conf
    volumes:
      - ./addons:/opt/odoo/addons
      - ./filestore:/opt/odoo/filestore
      - ./config:/opt/odoo/config
    command: >
      odoo
      --config=/opt/odoo/odoo.conf
      --db_host=postgres
      --db_user=odoo
      --db_password=${POSTGRES_PASSWORD}
      --addons-path=/opt/odoo/addons,/usr/lib/python3/dist-packages/odoo/addons
      --data-dir=/opt/odoo/filestore
      --xmlrpc-port=8071
      --longpolling-port=8073
      --workers=1
      --max-cron-threads=0
      --limit-memory-soft=671088640
      --limit-memory-hard=805306368
      --queue-job-channels=root:4
      --load=web,queue_job
    restart: unless-stopped
    networks:
      - odoo-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - odoo
    restart: unless-stopped
    networks:
      - odoo-network

volumes:
  postgres_data:

networks:
  odoo-network:
    driver: bridge
